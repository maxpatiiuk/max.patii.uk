# More pnpm settings than strictly necessary, but experimenting with a strict
# no-hoisting pnpm config

allowBuilds:
  esbuild: false
  unrs-resolver: false

autoDedupe: true
autoInstallPeers: false

catalog:
  '@arcgis/api-extractor': '5.2.0-next.123'
  '@arcgis/eslint-config': '5.2.0-next.123'
  '@arcgis/lumina': '5.2.0-next.123'
  '@arcgis/lumina-compiler': '5.2.0-next.123'
  '@arcgis/toolkit': '5.2.0-next.123'
  '@lit-labs/ssr': ^4.1.0
  '@types/node': ^24.11.0
  '@vitest/browser-playwright': 4.1.10
  '@vitest/coverage-v8': 4.1.10
  'eslint': '^10.11.0'
  'lint-staged': ^17.6.0
  'lit': 3.3.3
  'playwright': 1.63.0
  'prettier': ^3.9.9
  'tslib': '2.8.1'
  'typescript': ^6.0.3
  'vite': ^7.3.2
  'vitest': 4.1.10
catalogMode: strict
catalogPrune: true

dedupePeers: true
enablePrePostScripts: false
engineStrict: true
hoist: false
hoistPattern: []
hoistWorkspacePackages: false

minimumReleaseAge: 1440 # 1 day
minimumReleaseAgeExclude:
  - '@arcgis/*'
minimumReleaseAgeExcludePrune: true
nodeVersion: 24.11.0
overrides:
  why-is-node-running: 3.2.1
packages:
  - packages/*
resolvePeersFromWorkspaceRoot: false
saveTypes: true
strictPeerDependencies: true

trustLockfile: true
trustPolicy: no-downgrade
trustPolicyExcludePrune: true
verifyDepsBeforeRun: false
verifyStoreIntegrity: false
virtualStoreType: global
